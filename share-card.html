<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <!-- SOURCE FOR share.png, the 1200x630 social card. Not a page of the site:
       noindex, and nothing links to it. Regenerate after editing with

         "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
           --headless --disable-gpu --hide-scrollbars \
           --screenshot=share.png --window-size=1200,630 \
           file://$PWD/share-card.html

       The tagline is white-space:nowrap on purpose — at 1200px it fits on one
       line, and a two-line tagline under a one-line title reads as an
       accident. Shorten the words rather than letting it wrap. --><style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: #0f1419; color: #fff;
    display: flex; align-items: center; gap: 52px; padding: 0 70px;
    position: relative;
  }
  /* a soft brand wash from the lower right, so the card is not a flat block */
  body::after {
    content: ""; position: absolute; right: -160px; bottom: -220px;
    width: 760px; height: 760px; border-radius: 50%;
    background: radial-gradient(circle, rgba(29,155,240,.42), rgba(29,155,240,0) 68%);
  }
  .mark {
    flex: 0 0 196px; width: 196px; height: 196px; border-radius: 46px;
    background: linear-gradient(135deg, #1d9bf0, #0b5c93);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 18px 50px rgba(29,155,240,.26);
  }
  .copy { position: relative; z-index: 1; }
  h1 { font-size: 64px; line-height: 1.04; letter-spacing: -1.6px; font-weight: 800; }
  h1 em { font-style: normal; color: #1d9bf0; }
  p.tag { margin-top: 20px; font-size: 26px; line-height: 1.35; color: #c3ccd3; max-width: 800px; white-space: nowrap; }
  ul { margin-top: 30px; display: flex; gap: 10px; list-style: none; padding: 0; }
  li {
    font-size: 19px; font-weight: 600; color: #e5eaee;
    border: 1.5px solid #30414e; border-radius: 999px; padding: 9px 18px;
  }
  footer { position: absolute; left: 70px; bottom: 44px; font-size: 19px; color: #6b7a87; }
</style></head><body>
  <div class="mark">
    <svg width="118" height="118" viewBox="0 0 128 128">
      <line x1="40" y1="38" x2="40" y2="90" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      <circle cx="40" cy="38" r="9" fill="#fff"/>
      <rect x="58" y="33" width="46" height="9" rx="4.5" fill="#fff"/>
      <rect x="58" y="46" width="30" height="7" rx="3.5" fill="#fff" opacity="0.6"/>
      <circle cx="40" cy="64" r="9" fill="#fff"/>
      <rect x="58" y="59" width="46" height="9" rx="4.5" fill="#fff"/>
      <rect x="58" y="72" width="26" height="7" rx="3.5" fill="#fff" opacity="0.6"/>
      <circle cx="40" cy="90" r="9" fill="#fff"/>
      <rect x="58" y="85" width="40" height="9" rx="4.5" fill="#fff"/>
    </svg>
  </div>
  <div class="copy">
    <h1>Thread<em>Snap</em></h1>
    <p class="tag">Save a long X&nbsp;/&nbsp;Twitter thread as a clean PDF or images.</p>
    <ul><li>PDF or PNG</li><li>Paste a list of posts</li><li>Evidence mode</li></ul>
  </div>
  <footer>Free Chrome extension · runs locally · nothing uploaded</footer>
</body></html>
